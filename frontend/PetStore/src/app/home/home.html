<div class="grid-template">
  @if (isLoading) {
    <div class="col-wide">
      <p-text>Loading dashboard...</p-text>
    </div>
  } @else if (errorMessage) {
    <div class="col-wide">
      <p-text color="notification-error">{{ errorMessage }}</p-text>
    </div>
  } @else if (favoriteArtistId && favoriteArtistName) {
    <div class="col-narrow">
      <app-artist-card
        [artistId]="favoriteArtistId"
        [artistName]="favoriteArtistName"
        [artistSince]="favoriteArtist?.yearStarted"
        [artistImg]="favoriteArtist.imageUrl ?? '/api/media/placeholders/artist.svg'">
      </app-artist-card>
    </div>
  } @else {
    <div class="col-wide">
      <p-text>No favorite artist.</p-text>
    </div>
  }
</div>
