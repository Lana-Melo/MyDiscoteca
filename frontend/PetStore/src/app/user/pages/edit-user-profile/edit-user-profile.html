
<div class="grid-template">

    <div class="col-wide">
        <p-heading>Edit Profile</p-heading>  
    </div>

    @if (isLoading) {
        <div class="col-wide">
            <p-text>Loading...</p-text>
        </div>
    } @else if (errorMessage) {
        <div class="col-wide">
            <p-text color="notification-error">{{ errorMessage }}</p-text>
        </div>
    } @else if (successMessage) {
        <div class="col-wide">
            <p-text color="notification-success">{{ successMessage }}</p-text>
        </div>
    } @else {
        <div class="col-wide grid grid-cols-subgrid">

            <div class="col-span-one-half">
                <p-input-text label="Name" [(ngModel)]="username" name="username"></p-input-text>
            </div>

            <div class="col-span-one-half">
                <p-input-date label="Birth Date" [(ngModel)]="birthDate" name="birthDate"></p-input-date>
            </div>

            <div class="col-span-one-half">
                <p-input-email label="Email" [(ngModel)]="email" name="email"></p-input-email>
            </div>

            <div class="col-span-one-half">
                <p-input-password label="New Password (optional)" name="newPassword" [(ngModel)]="newPassword" [toggle]="true"></p-input-password>
            </div>
        </div>

        <div class="col-wide">
            <p-button type="button" [aria]="{'aria-haspopup': 'dialog'}" (click)="openConfirmModal()">
                Save changes
            </p-button>
            <!-- 
            Modal de confirmação de password

            [open] → recebe do componente pai (abre/fecha modal)
            (close) → evento emitido pelo filho para fechar
            (confirm) → evento emitido quando o user confirma (guardar)
            -->
            <app-password-confirm-modal
                [open]="modalOpen" 
                (close)="closeModal()"
                (confirm)="saveConfirmed($event)">
            </app-password-confirm-modal>
        </div>

        <div class="col-wide">
            <a [routerLink]="['/user/profile', userId]">
                <p-button variant="ghost">Cancel</p-button>
            </a>
        </div>
    }
</div>
