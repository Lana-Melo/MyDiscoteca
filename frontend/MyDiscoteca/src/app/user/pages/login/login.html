<div class="grid-template">
  <div class="col-narrow  text-center">
    <p-heading align="center" size="large" tag="h1">Login</p-heading>
  </div>

  @if (errorMessage) {
    <div class="col-narrow">
      <p-inline-notification headingTag="h2" state="error" heading="Login failed" [description]="errorMessage" [dismissButton]="false"></p-inline-notification>
    </div>
  }
  @if (successMessage) {
    <div class="col-narrow">
      <p-inline-notification headingTag="h2" state="success" heading="Registration complete" [description]="successMessage"></p-inline-notification>
    </div>
  }

  <div class="col-narrow">
      <p-input-text label="Username" [(ngModel)]="username" name="username"></p-input-text>
  </div>
  <div class="col-narrow">
    <p-input-password
      label="Password"
      name="password"
      [(ngModel)]="password"
      [toggle]="true">
    </p-input-password>
  </div>



  <div class="col-narrow flex justify-center gap-4">
    <p-button type="button" [disabled]="isLoading" (click)="login()">
      Login
    </p-button>
  </div>
  <div class="col-narrow flex justify-center gap-4">
    <p-button-pure name="Create Account" value="Create Account" [underline]="true" icon="user" [routerLink]="['/register']">
      Create account
    </p-button-pure>
  </div>
</div>
