<div class="grid-template">
    <div class="col-basic">
        <p-heading tag="h1">Profile</p-heading>  
    </div>
    @if (successMessage) {
        <div class="col-basic">
            <p-inline-notification
                headingTag="h2"
                state="success"
                heading="Profile updated"
                [description]="successMessage"
                [dismissButton]="false">
            </p-inline-notification>
        </div>
    }

    @if (isLoading) {
        <div class="col-basic">
          <p-text>Loading user profile...</p-text>
        </div>
      } @else if (errorMessage) {
        <div class="col-basic">
          <p-text color="notification-error">{{ errorMessage }}</p-text>
        </div>
      } @else if (user) {
        <div class="col-basic grid grid-cols-subgrid gap-y-3">
        <div class="col-span-one-half">
          <p-input-text label="Username" [value]="user.username" [disabled]="true"></p-input-text>
        </div>
        <div class="col-span-one-half">
          <p-input-text label="Email" [value]="user.email" [disabled]="true"></p-input-text>
        </div>
        <div class="col-span-one-half">
          <p-input-date label="Birth Date" [value]="birthDateValue" [disabled]="true"></p-input-date>
        </div>
        <div class="col-span-one-half">
          <p-input-text label="Favorite Artist" [value]="favoriteArtistName" [disabled]="true"></p-input-text>
          @if (favoriteArtistId) {
            <a [routerLink]="['/artist/details', favoriteArtistId]" [queryParams]="{ from: 'profile' }">
              <p-button-pure>
                Go to artist profile
              </p-button-pure>
            </a>
          }
        </div>
        <div class="col-span-one-half">
          <a [routerLink]="['/user/profile/edit']">
            <p-button>
              Edit profile
            </p-button>
          </a>
        </div>
      </div>
    }
</div>
