<header class="grid-template gap-y-0">

  <!-- TOP BAR -->
  <div class="col-full flex justify-center py-static-xs px-static-md bg-surface dark">
    <p class="prose-text-xs">
        <!-- se quisermos aquela barra preta do template, colocar um texto aqui-->
    </p>
  </div>

  <!-- MAIN HEADER -->
  <div class="col-wide grid grid-cols-[1fr_auto_1fr] items-center min-h-[80px]">

    <!-- LEFT -->
    <div class="flex gap-static-md items-center">
      @if (isLoggedIn) {
        <p-button-pure
          icon="menu-lines"
          type="button"
          [aria]="{'aria-label': 'Menu'}"
          (click)="openNav()">
        </p-button-pure>
      }
    </div>

    <!-- CENTER -->
    <div class="flex justify-center">
      <div class="flex justify-center items-center">
        <a routerLink="/dashboard" class="text-lg font-semibold tracking-wide">
            MyDiscoteca 🎶
        </a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="flex justify-end gap-static-md">


    <!--
      <p-button-pure icon="search"></p-button-pure>
    <p-link-pure icon="heart" href="#">
        Favorit Artist
      </p-link-pure>
    -->
      @if (isLoggedIn) {
        <div class="flex items-center gap-static-sm">
          @if (currentUserFirstName) {
            <p-text size="small">{{ currentUserFirstName }}</p-text>
          }

          @if (showProfilePopover) {
            <p-popover direction="bottom" [aria]="{'aria-label': 'User menu'}">
              <p-button-pure
                slot="button"
                type="button"
                icon="user">
              </p-button-pure>

              <div class="flex flex-col items-start gap-static-sm">
                <p-button-pure type="button" icon="user" (click)="goToProfile()">Profile</p-button-pure>
                <p-button-pure type="button" icon="close" (click)="logout()">Logout</p-button-pure>
              </div>
            </p-popover>
          }
        </div>
      }

    </div>

  </div>

  <div class="col-full flex justify-center border-t-thin border-contrast-low">
  </div>
  <!-- NAVIGATION BAR -->
  @if (isLoggedIn) {
    <div class="col-full flex justify-center border-t-thin border-contrast-low py-static-sm flex justify-center min-h-[48px]">
        @if (isNavOpen) {
        <p-tabs-bar>
          <p-button-pure type="button" icon="search" (click)="goToArtists()">Explore artists</p-button-pure>
        </p-tabs-bar>
        }
    </div>
  }

</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer></footer>
