<div class="grid-template">
  <div class="col-wide">
    <p-heading tag="h1">Hello, {{ username }}</p-heading>
  </div>

  @if (isLoading) {
    <div class="col-wide" style="text-align: center;">
      <p-spinner></p-spinner>
    </div>
  } @else if (errorMessage) {
    <div class="col-wide">
      <p-text color="notification-error">{{ errorMessage }}</p-text>
    </div>
  } @else {
    <div class="col-wide dashboard-grid">

      <a
        [routerLink]="favoriteArtistId ? ['/artist/details', favoriteArtistId] : null"
        class="dashboard-card">
        <div class="card-circle artist-circle">
          <img [src]="favoriteArtistImage" [alt]="favoriteArtistName || 'Favorite Artist'" />
        </div>
        <div class="card-label">
          <p-text><strong>{{ favoriteArtistName || 'No favorite artist' }}</strong></p-text>
          <p-text size="x-small" color="contrast-medium">Favorite Artist</p-text>
        </div>
      </a>

      <a routerLink="/user/collection" class="dashboard-card">
        <div class="card-circle icon-circle">
          <p-icon name="play" aria-hidden="true"></p-icon>
        </div>
        <div class="card-label">
          <p-text><strong>My Albums</strong></p-text>
        </div>
      </a>

      <a routerLink="/album-lists" class="dashboard-card">
        <div class="card-circle icon-circle">
          <p-icon name="list" aria-hidden="true"></p-icon>
        </div>
        <div class="card-label">
          <p-text><strong>My Lists</strong></p-text>
        </div>
      </a>

      <a routerLink="/search" class="dashboard-card">
        <div class="card-circle icon-circle">
          <p-icon name="search" aria-hidden="true"></p-icon>
        </div>
        <div class="card-label">
          <p-text><strong>Explore</strong></p-text>
        </div>
      </a>

      <a routerLink="/contributions/album-version/my-requests" class="dashboard-card">
        <div class="card-circle icon-circle">
          <p-icon name="send" aria-hidden="true"></p-icon>
        </div>
        <div class="card-label">
          <p-text><strong>My Album Requests</strong></p-text>
        </div>
      </a>

    </div>
  }
</div>
